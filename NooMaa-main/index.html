<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f3ed">
    <title>NooMaa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="CSS/header.css">
    <link rel="stylesheet" href="CSS/index.css">
</head>
<body>
    
    <header class="site-header">
        <a class="brand" href="#home" aria-label="NooMaa - home">
            <span class="brand__eyebrow">ATELIER</span>
            <span class="brand__name">NooMaa</span>
        </a>

        <nav class="main-nav" aria-label="Hoofdnavigatie">
            <a class="main-nav__link main-nav__link--active" href="#home" aria-current="page">Home</a>
            <a class="main-nav__link" href="HTML/products.html">Products</a>
        </nav>

        <div class="header-actions">
            <a class="header-actions__link" href="#favorites" aria-label="Favorieten">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20.8 8.7c0 4.1-8.8 10.1-8.8 10.1S3.2 12.8 3.2 8.7a4.5 4.5 0 0 1 8.8-1.3 4.5 4.5 0 0 1 8.8 1.3Z"/>
                </svg>
            </a>
            <a class="header-actions__link" href="#cart" aria-label="Winkelmandje">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 4h2l2.1 10.1a2 2 0 0 0 2 1.6h8.5a2 2 0 0 0 1.9-1.5L21 8H6"/>
                    <circle cx="9.5" cy="19" r="1.2"/>
                    <circle cx="17.5" cy="19" r="1.2"/>
                </svg>
            </a>
        </div>
    </header>

    <div class="frontimg">
          <img src="img/Burgundy NooMaa Atelier Living Room.png" alt="Front page" class="frontimg__logo">
        </div>

    <section class="product-grid" aria-label="Producten">
        <article class="product1__container">
            <div class="product1">
                <h2 class="product1__title">NooMaa placeholdername</h2>
                <button class="product1__button" aria-label="Bekijk product">
                <img src="img/brownCouchPlaceholder.png" alt="NooMaa product image" class="product1__image">
                </button>
            </div>
        </article>
        <article class="product2__container">
            <div class="product2">
                <h2 class="product2__title">NooMaa placeholdername</h2>
                <button class="product2__button" aria-label="Bekijk product">
                <img src="img/RedCouchPlaceholder.png" alt="NooMaa product image" class="product2__image">
                </button>
            </div>
        </article>
        <article class="product3__container">
            <div class="product3">
                <h2 class="product3__title">NooMaa placeholdername</h2>
                <button class="product3__button" aria-label="Bekijk product">
                    <img src="img/WhiteCouchCropped.png" alt="NooMaa product image" class="product3__image">
                </button>
            </div>
        </article>
        <article class="product4__container">
            <div class="product4">
                <h2 class="product4__title">NooMaa placeholdername</h2>
                <button class="product4__button" aria-label="Bekijk product">
                    <img src="img/WhiteCouchCropped2.png" alt="NooMaa product image" class="product4__image">
                </button>
            </div>
        </article>
    </section>

</body>
</html>
