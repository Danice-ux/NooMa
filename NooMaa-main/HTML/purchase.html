<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jouw bank</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/purchase.css">
    <link rel="stylesheet" href="../CSS/header.css">
    <script src="../JS/carousel.js" defer></script>
    <script src="../JS/products.js" defer></script>
</head>
<body>

        <header class="site-header">
        <a class="brand" href="../index.html" aria-label="NooMaa - home">
            <span class="brand__eyebrow">ATELIER</span>
            <span class="brand__name">NooMaa</span>
        </a>

        <nav class="main-nav" aria-label="Hoofdnavigatie">
            <a class="main-nav__link" href="../index.html">Home</a>
            <a class="main-nav__link main-nav__link--active" href="products.html" aria-current="page">Products</a>
        </nav>

        <div class="header-actions">
            <a class="header-actions__link" href="#favorites" aria-label="Favorieten">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20.8 8.7c0 4.1-8.8 10.1-8.8 10.1S3.2 12.8 3.2 8.7a4.5 4.5 0 0 1 8.8-1.3 4.5 4.5 0 0 1 8.8 1.3Z"/>
                </svg>
            </a>
            <a class="header-actions__link" href="#cart" aria-label="Winkelmandje">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 4h2l2.1 10.1a2 2 0 0 0 2 1.6h8.5a2 2 0 0 0 1.9-1.5L21 8H6"/>
                    <circle cx="9.5" cy="19" r="1.2"/>
                    <circle cx="17.5" cy="19" r="1.2"/>
                </svg>
            </a>
        </div>
    </header>

  


  <section class="product-details">
    <!-- carousel -->
    <div class="room">
        <img id="background" src="../img/bg1.png" alt="Woonkamer">
        <img id="sofa" src="../img/bank1.png" alt="Bank">
    </div>

    <div class="controls-row">
    <div class="controls">
        <button id="prev">❮</button>
        <span>Change background</span>
        <button id="next">❯</button>
    </div>

    <div class="controls">
        <button id="prev-sofa">❮</button>
        <span>Change sofa</span>
        <button id="next-sofa">❯</button>
    </div>
    </div>

        <div class="product-info">
        <h1 id="name" class="product-name"></h1>
        <h2 id="price" class="product-price"></h2>
        <p id="description"></p>
        </div>
        <button onclick="history.back()" class="back-button">Terug</button>
    </section>

</body>
</html>
